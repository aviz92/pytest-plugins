[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-plugins"
version = "3.1.1"
description = "A Python package for managing pytest plugins."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]
keywords = ["development", "pytest", "plugins", "testing", "automation"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "custom-python-logger>=4.1.0",
    "pytest>=9.0.2",
    "python-base-command>=0.1.8",
    "python-base-toolkit>=1.1.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pre-commit>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/aviz92/pytest-plugins"
Repository = "https://github.com/aviz92/pytest-plugins"
Issues = "https://github.com/aviz92/pytest-plugins/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_plugins*"]
namespaces = false

[project.entry-points.pytest11]
better_report = "pytest_plugins.better_report"
max_fail_streak = "pytest_plugins.max_fail_streak"
fail2skip = "pytest_plugins.fail2skip"
add_config_parameters = "pytest_plugins.add_config_parameters"
verbose_param_ids = "pytest_plugins.verbose_param_ids"
require_tests = "pytest_plugins.require_tests"

[project.scripts]
better_report_compare = "pytest_plugins.better_report_compare:main"
